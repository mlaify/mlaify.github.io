# Site-wide params consumed by the custom theme.

description = "mlaify ships open-source security and AI-assisted tooling. Home of Aegis (post-quantum encrypted messaging) and AttackMap (defensive security analysis)."
tagline = "Open-source security tooling and AI-assisted workflows."

# Default OG / Twitter image (relative to /static).
# Per-section overrides live in front matter (`ogImage:` in section _index.md).
# Until per-product OG images are designed, fall back to the existing cover.png.
ogImage = "cover.png"
twitterHandle = ""

# Repo / org links.
githubOrg = "https://github.com/mlaify"
siteRepo = "https://github.com/mlaify/mlaify.github.io"

# Footer build/version info.
showBuildInfo = false

# JSON-LD organization schema.
[org]
  name = "mlaify"
  legalName = "mlaify"
  url = "https://mlaify.io/"
  logo = "https://mlaify.io/icon.svg"
  sameAs = ["https://github.com/mlaify"]

# Per-product params used by section landing pages.
[products]
  [products.aegis]
    name = "Aegis"
    tagline = "Post-quantum encrypted messaging, end to end."
    status = "alpha"
    repoUrl = "https://github.com/mlaify/aegis"
    specRepoUrl = "https://github.com/mlaify/aegis-spec"
    docsRepoUrl = "https://github.com/mlaify/aegis-docs"
    accent = "aegis"
    appBundleIos = "io.aegis.ios"
    appBundleMac = "io.aegis.mac"
    appPackageAndroid = "io.aegis.android"

  [products.attackmap]
    name = "AttackMap"
    tagline = "Understand your system. Defend it better."
    status = "alpha"
    repoUrl = "https://github.com/mlaify/attackmap"
    wikiUrl = "https://github.com/mlaify/attackmap/wiki"
    pypiName = "attackmap"
    accent = "attackmap"
