# Deploys mlaify.io to Cloudflare (Workers static assets) after the operator approves.
#
# Every push to main starts this job in the `production` environment, which waits for its
# required reviewer (operator decision 2026-11-04); once approved it builds the site and
# deploys it. Workers Builds still builds every push, but only uploads a version
# (`wrangler versions upload`); this job is the only thing that changes the live site.
# See README.md "Deploy".
name: deploy

on:
    push:
        branches: [main]
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: deploy
    cancel-in-progress: false

env:
    HUGO_VERSION: 0.162.1

jobs:
    deploy:
        runs-on: ubuntu-24.04
        environment:
            name: production
            url: https://mlaify.io/
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version-file: .nvmrc

            - name: Hugo
              run: |
                  base="https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}"
                  tarball="hugo_extended_${HUGO_VERSION}_linux-amd64.tar.gz"
                  cd "$RUNNER_TEMP"
                  curl -fsSLO "$base/$tarball"
                  curl -fsSLO "$base/hugo_${HUGO_VERSION}_checksums.txt"
                  grep " ${tarball}\$" "hugo_${HUGO_VERSION}_checksums.txt" | sha256sum -c -
                  mkdir hugo && tar -xzf "$tarball" -C hugo hugo
                  echo "$RUNNER_TEMP/hugo" >>"$GITHUB_PATH"

            # The same build Workers Builds runs: npm ci, Hugo, Pagefind, scripts/check-build.sh.
            - name: Build
              run: npm run build:cf

            - name: Deploy
              env:
                  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
                  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
              run: npx wrangler deploy
