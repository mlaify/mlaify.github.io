name: Build and deploy

# Pull requests run `build` only — full Hugo + Pagefind build with output checks,
# no server access. Pushes to main additionally run `deploy`, which rsyncs the
# artifact produced by `build` to the InterServer docroot for matthewd.xyz.
#
# The split into two jobs is deliberate: `environment: production` cannot be
# applied conditionally, so a single job would make pull requests wait on the
# production approval gate.

on:
  push:
    branches: [main]
  # Deliberately unfiltered. A `branches:` filter here matches the PR's BASE
  # branch, so `[main]` would silently skip CI on any stacked PR (one targeting
  # a feature branch rather than main) — which is exactly how the actions-bump
  # PR ended up with no build at all.
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Grouped by ref so pushes to main queue rather than cancel each other, while
# repeated pushes to a PR supersede their own in-flight runs.
concurrency:
  group: matthewd-xyz-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      DART_SASS_VERSION: 1.97.1
      GO_VERSION: 1.25.5
      HUGO_VERSION: 0.162.1
      NODE_VERSION: 24.12.0
      TZ: US/Chicago
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Create local bin
        run: mkdir -p "${HOME}/.local"

      - name: Install Dart Sass
        run: |
          curl -sLJO "https://github.com/sass/dart-sass/releases/download/${DART_SASS_VERSION}/dart-sass-${DART_SASS_VERSION}-linux-x64.tar.gz"
          tar -C "${HOME}/.local" -xf "dart-sass-${DART_SASS_VERSION}-linux-x64.tar.gz"
          rm "dart-sass-${DART_SASS_VERSION}-linux-x64.tar.gz"
          echo "${HOME}/.local/dart-sass" >> "${GITHUB_PATH}"

      - name: Install Hugo
        run: |
          curl -sLJO "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.tar.gz"
          mkdir "${HOME}/.local/hugo"
          tar -C "${HOME}/.local/hugo" -xf "hugo_extended_${HUGO_VERSION}_linux-amd64.tar.gz"
          rm "hugo_extended_${HUGO_VERSION}_linux-amd64.tar.gz"
          echo "${HOME}/.local/hugo" >> "${GITHUB_PATH}"

      - name: Verify installations
        run: |
          echo "Dart Sass: $(sass --version)"
          echo "Go:        $(go version)"
          echo "Hugo:      $(hugo version)"
          echo "Node.js:   $(node --version)"
          echo "npm:       $(npm --version)"

      - name: Install Node dependencies
        run: npm ci

      - name: Configure Git
        run: git config core.quotepath false

      - name: Cache restore
        id: cache-restore
        uses: actions/cache/restore@v6
        with:
          path: ${{ runner.temp }}/hugo_cache
          key: hugo-${{ github.run_id }}
          restore-keys: hugo-

      # baseURL comes from config/_default/hugo.toml (https://matthewd.xyz/).
      # Do not override it here — the old GitHub Pages workflow injected
      # actions/configure-pages output, which no longer applies.
      - name: Build site
        run: |
          hugo \
            --gc \
            --minify \
            --cacheDir "${{ runner.temp }}/hugo_cache"

      - name: Build Pagefind index
        run: npx pagefind --site public

      - name: Cache save
        if: github.event_name != 'pull_request'
        uses: actions/cache/save@v6
        with:
          path: ${{ runner.temp }}/hugo_cache
          key: ${{ steps.cache-restore.outputs.cache-primary-key }}

      # MIME types for the Apple/Jamf DDM payload are configured on the
      # InterServer host itself, not in this repo. Nothing here asserts them.
      - name: Sanity-check build output
        run: |
          test -f public/index.html || { echo "::error::public/index.html missing"; exit 1; }
          test -f public/404.html   || { echo "::error::public/404.html missing"; exit 1; }
          test -d public/pagefind   || { echo "::error::public/pagefind missing"; exit 1; }
          test -f public/.well-known/security.txt || { echo "::error::security.txt missing"; exit 1; }
          echo "Build output looks sane ($(find public -type f | wc -l) files)."

      # include-hidden-files is REQUIRED. It defaults to false, which would
      # silently drop public/.well-known/ — and therefore security.txt — from
      # the artifact and so from the deploy.
      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: site-public
          path: public/
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: error

  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v8
        with:
          name: site-public
          path: public

      - name: Confirm artifact survived the round trip
        run: |
          test -f public/index.html || { echo "::error::index.html missing from artifact"; exit 1; }
          test -f public/.well-known/security.txt || { echo "::error::security.txt missing from artifact — check include-hidden-files"; exit 1; }
          echo "Artifact intact ($(find public -type f | wc -l) files)."

      # ---------------------------------------------------------------------
      # Guard 1: validate DEPLOY_PATH before any network access.
      #
      # On 2026-07-26 this secret was empty, so "${DEPLOY_PATH}/" expanded to
      # "/" and rsync --delete ran against the CageFS account root, removing
      # 6679 paths including all server-side mail. Nothing in the old workflow
      # noticed. These checks exist so that failure mode is impossible.
      # ---------------------------------------------------------------------
      - name: Validate deploy target
        env:
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          if [ -z "${DEPLOY_PATH:-}" ]; then
            echo "::error::DEPLOY_PATH is empty. Refusing to deploy — an empty value expands to / and rsync --delete would target the whole account."
            exit 1
          fi
          case "$DEPLOY_PATH" in
            /*) ;;
            *) echo "::error::DEPLOY_PATH must be an absolute path, got '$DEPLOY_PATH'"; exit 1 ;;
          esac
          case "$DEPLOY_PATH" in
            *..*) echo "::error::DEPLOY_PATH must not contain '..'"; exit 1 ;;
          esac

          CLEAN="$DEPLOY_PATH"
          while [ "$CLEAN" != "${CLEAN%/}" ]; do CLEAN="${CLEAN%/}"; done
          if [ -z "$CLEAN" ]; then
            echo "::error::DEPLOY_PATH resolves to /. Refusing."
            exit 1
          fi
          case "$CLEAN" in
            /bin|/boot|/dev|/etc|/home|/lib|/opt|/proc|/root|/run|/sbin|/srv|/sys|/tmp|/usr|/var)
              echo "::error::DEPLOY_PATH '$CLEAN' is a system directory. Refusing."
              exit 1 ;;
          esac

          DEPTH=$(printf '%s' "${CLEAN#/}" | awk -F/ '{print NF}')
          if [ "$DEPTH" -lt 3 ]; then
            echo "::error::DEPLOY_PATH '$CLEAN' is only $DEPTH level(s) deep. A docroot should be at least 3 (e.g. /home/<user>/public_html). Refusing."
            exit 1
          fi

          echo "DEPLOY_PATH_CLEAN=$CLEAN" >> "$GITHUB_ENV"
          echo "Deploy target validated: $CLEAN (depth $DEPTH)"

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      # ---------------------------------------------------------------------
      # Guard 2: the target must be a directory explicitly marked as a deploy
      # destination. Create it once per docroot:
      #     touch <docroot>/.deploy-ok
      # Server-side only, and excluded from --delete below, so it is never
      # shipped or removed. A wrong-but-plausible path fails here.
      # ---------------------------------------------------------------------
      - name: Confirm target is a marked docroot
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT || '22' }}
        run: |
          SSH="ssh -i ~/.ssh/deploy_key -p ${DEPLOY_PORT} -o StrictHostKeyChecking=yes -o UserKnownHostsFile=~/.ssh/known_hosts"
          if ! $SSH "${DEPLOY_USER}@${DEPLOY_HOST}" "test -f '${DEPLOY_PATH_CLEAN}/.deploy-ok'"; then
            echo "::error::No .deploy-ok sentinel in ${DEPLOY_PATH_CLEAN} on ${DEPLOY_HOST}. Refusing to deploy. If this path is correct, run: touch ${DEPLOY_PATH_CLEAN}/.deploy-ok"
            exit 1
          fi
          echo "Sentinel found in ${DEPLOY_PATH_CLEAN}."

      # ---------------------------------------------------------------------
      # Guard 3: dry-run first and refuse if the deletion count is implausible.
      # This is what makes a runaway delete impossible rather than merely
      # bounded: --max-delete alone still deletes up to its cap before
      # aborting, so the count must be checked BEFORE any real run.
      # ---------------------------------------------------------------------
      - name: Dry-run and gate on deletion count
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT || '22' }}
          MAX_DELETIONS: ${{ vars.MAX_DELETIONS || '100' }}
        run: |
          SSH="ssh -i ~/.ssh/deploy_key -p ${DEPLOY_PORT} -o StrictHostKeyChecking=yes -o UserKnownHostsFile=~/.ssh/known_hosts"
          rsync -rlptDv --dry-run --delete \
            --exclude '.well-known/acme-challenge/' \
            --exclude '.DS_Store' \
            --exclude '.deploy-ok' \
            -e "$SSH" \
            public/ "${DEPLOY_USER}@${DEPLOY_HOST}:${DEPLOY_PATH_CLEAN}/" > /tmp/dryrun.log

          DEL=$(grep -c '^deleting ' /tmp/dryrun.log || true)
          echo "Dry run: would delete ${DEL} path(s); limit is ${MAX_DELETIONS}."
          if [ "$DEL" -gt 0 ]; then
            echo "--- deletions ---"
            grep '^deleting ' /tmp/dryrun.log | head -50
            [ "$DEL" -gt 50 ] && echo "... and $((DEL - 50)) more"
          fi

          if [ "$DEL" -gt "$MAX_DELETIONS" ]; then
            echo "::error::Dry run would delete ${DEL} paths, over the ${MAX_DELETIONS} limit. Refusing — nothing has been deleted. Check DEPLOY_PATH, or raise the MAX_DELETIONS repository variable if this is intentional."
            exit 1
          fi

      # rsync flags: -rlptD is -a minus owner/group, which shared hosting will
      # not let us set. --max-delete is a backstop in case the tree changed
      # between the dry run and now. acme-challenge is excluded so an in-flight
      # cert renewal survives; .DS_Store so macOS metadata is never published;
      # .deploy-ok so the sentinel is preserved.
      - name: Deploy to InterServer
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT || '22' }}
          MAX_DELETIONS: ${{ vars.MAX_DELETIONS || '100' }}
        run: |
          SSH="ssh -i ~/.ssh/deploy_key -p ${DEPLOY_PORT} -o StrictHostKeyChecking=yes -o UserKnownHostsFile=~/.ssh/known_hosts"
          rsync -rlptDvz --human-readable \
            --delete \
            --max-delete="${MAX_DELETIONS}" \
            --exclude '.well-known/acme-challenge/' \
            --exclude '.DS_Store' \
            --exclude '.deploy-ok' \
            -e "$SSH" \
            public/ "${DEPLOY_USER}@${DEPLOY_HOST}:${DEPLOY_PATH_CLEAN}/"

      - name: Clean up SSH key
        if: always()
        run: rm -f ~/.ssh/deploy_key

      # No live-site curl check here on purpose. matthewd.xyz sits behind
      # Cloudflare, which issues a JS challenge to non-browser clients and
      # returns 403 to Actions runners (cf-mitigated: challenge). That put a red
      # X on an earlier InterServer deploy that had actually succeeded. rsync's
      # own exit status is the real signal; verify from a browser instead.
