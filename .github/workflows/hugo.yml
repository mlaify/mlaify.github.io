name: Build and deploy

# Builds the Hugo site and publishes it to GitHub Pages, which serves
# matthewd.xyz (the CNAME file pins the domain).
#
# Pull requests run `build` only — full Hugo + Pagefind build with output
# checks, and no Pages permissions. Pushes to main additionally run `deploy`.
#
# The split into two jobs is deliberate: the deploy job needs pages:write and
# id-token:write, and PRs should never hold those. Job-level `permissions:`
# keeps the elevated scopes off the build job entirely.

on:
  push:
    branches: [main]
  # Deliberately unfiltered. A `branches:` filter here matches the PR's BASE
  # branch, so `[main]` silently skips CI on any stacked PR — one targeting a
  # feature branch rather than main.
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      DART_SASS_VERSION: 1.97.1
      GO_VERSION: 1.25.5
      HUGO_VERSION: 0.162.1
      NODE_VERSION: 24.12.0
      TZ: US/Chicago
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Create local bin
        run: mkdir -p "${HOME}/.local"

      - name: Install Dart Sass
        run: |
          curl -sLJO "https://github.com/sass/dart-sass/releases/download/${DART_SASS_VERSION}/dart-sass-${DART_SASS_VERSION}-linux-x64.tar.gz"
          tar -C "${HOME}/.local" -xf "dart-sass-${DART_SASS_VERSION}-linux-x64.tar.gz"
          rm "dart-sass-${DART_SASS_VERSION}-linux-x64.tar.gz"
          echo "${HOME}/.local/dart-sass" >> "${GITHUB_PATH}"

      - name: Install Hugo
        run: |
          curl -sLJO "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.tar.gz"
          mkdir "${HOME}/.local/hugo"
          tar -C "${HOME}/.local/hugo" -xf "hugo_extended_${HUGO_VERSION}_linux-amd64.tar.gz"
          rm "hugo_extended_${HUGO_VERSION}_linux-amd64.tar.gz"
          echo "${HOME}/.local/hugo" >> "${GITHUB_PATH}"

      - name: Verify installations
        run: |
          echo "Dart Sass: $(sass --version)"
          echo "Go:        $(go version)"
          echo "Hugo:      $(hugo version)"
          echo "Node.js:   $(node --version)"
          echo "npm:       $(npm --version)"

      - name: Install Node dependencies
        run: npm ci

      - name: Configure Git
        run: git config core.quotepath false

      - name: Cache restore
        id: cache-restore
        uses: actions/cache/restore@v6
        with:
          path: ${{ runner.temp }}/hugo_cache
          key: hugo-${{ github.run_id }}
          restore-keys: hugo-

      # baseURL comes from config/_default/hugo.toml (https://matthewd.xyz/),
      # which is authoritative and matches the CNAME. actions/configure-pages
      # is not used, so the build job needs no Pages permissions.
      - name: Build site
        run: |
          hugo \
            --gc \
            --minify \
            --cacheDir "${{ runner.temp }}/hugo_cache"

      - name: Build Pagefind index
        run: npx pagefind --site public

      - name: Cache save
        if: github.event_name != 'pull_request'
        uses: actions/cache/save@v6
        with:
          path: ${{ runner.temp }}/hugo_cache
          key: ${{ steps.cache-restore.outputs.cache-primary-key }}

      - name: Sanity-check build output
        run: |
          test -f public/index.html || { echo "::error::public/index.html missing"; exit 1; }
          test -f public/404.html   || { echo "::error::public/404.html missing"; exit 1; }
          test -d public/pagefind   || { echo "::error::public/pagefind missing"; exit 1; }
          test -f public/CNAME      || { echo "::error::public/CNAME missing — Pages would drop the custom domain"; exit 1; }
          test -f public/.well-known/security.txt || { echo "::error::security.txt missing"; exit 1; }
          echo "Build output looks sane ($(find public -type f | wc -l) files)."

      # include-hidden-files is set explicitly so public/.well-known/ — and
      # therefore security.txt — cannot be dropped silently.
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./public
          include-hidden-files: true

  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # No live-site curl check here on purpose. matthewd.xyz sits behind
      # Cloudflare, which issues a JS challenge to non-browser clients and
      # returns 403 to Actions runners — that produced a red X on a deploy
      # that had actually succeeded. deploy-pages already reports the real
      # outcome of the deployment.
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
