{{- $org := site.Params.org -}}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "Organization",
  "name": {{ $org.name | jsonify }},
  "url": {{ $org.url | jsonify }},
  "logo": {{ $org.logo | jsonify }},
  "sameAs": {{ $org.sameAs | jsonify }},
  "description": {{ site.Params.description | jsonify }}
}
</script>
