{{- $root := cond .IsSection . .Parent -}}
<article class="container-page py-12 lg:py-16">
  {{ partial "breadcrumbs.html" . }}

  <header class="mb-6 max-w-3xl">
    {{- if not .IsSection }}
    <p class="mb-2 text-sm font-medium accent-text"><a href="{{ $root.RelPermalink }}">{{ $root.Title }}</a></p>
    {{- end }}
    <h1 class="text-balance text-4xl font-semibold tracking-tight text-ink-900 sm:text-5xl dark:text-white">{{ .Title }}</h1>
    {{ with .Params.lead | default .Description }}
      <p class="mt-4 text-lg text-ink-600 dark:text-ink-300">{{ . }}</p>
    {{ end }}
  </header>

  <div class="mb-10">{{ partial "product-nav.html" . }}</div>

  <div class="grid gap-12 lg:grid-cols-12">
    <div class="prose-mlaify max-w-3xl lg:col-span-9">
      {{ .Content }}
    </div>
    <div class="hidden lg:col-span-3 lg:block">
      {{ partial "toc.html" . }}
    </div>
  </div>
</article>
