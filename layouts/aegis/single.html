{{ define "main" }}
<article class="container-page py-12 lg:py-16" data-accent="aegis">
  <div class="grid gap-12 lg:grid-cols-12">
    <aside class="hidden lg:col-span-3 lg:block">
      {{ partial "sidebar.html" . }}
    </aside>

    <div class="lg:col-span-9">
      {{ partial "breadcrumbs.html" . }}
      <header class="mb-8">
        <h1 class="text-balance text-4xl font-semibold tracking-tight text-ink-900 sm:text-5xl dark:text-white">{{ .Title }}</h1>
        {{ with .Params.lead | default .Description }}
          <p class="mt-4 max-w-3xl text-lg text-ink-600 dark:text-ink-300">{{ . }}</p>
        {{ end }}
      </header>
      <div class="prose-mlaify max-w-none">
        {{ .Content }}
      </div>
    </div>
  </div>
</article>
{{ end }}
